name: Build Reels Tasbih APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare web files and assets
        run: |
          mkdir -p www assets
          cp index.html sw.js kaaba.jpg www/
          cp icon-only.png icon-foreground.png icon-background.png assets/

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Generate icons
        continue-on-error: true
        run: npx --yes @capacitor/assets generate --android

      - name: Patch manifest (vibrate + portrait)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.VIBRATE" />\n</manifest>#' $M
          sed -i 's#<activity#<activity android:screenOrientation="portrait"#' $M

      - name: Sync web files
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk reels-tasbih.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: reels-tasbih v${{ github.run_number }}
          files: reels-tasbih.apk
